<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexoFluye — Sin conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1E3A8A;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,0.2);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 24px;
      border: 2px solid rgba(255,255,255,0.3);
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.6; max-width: 300px; margin-bottom: 32px; }
    .badge {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 10px;
    }
    button {
      margin-top: 24px;
      background: white;
      color: #1E3A8A;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="logo">N</div>
  <h1>Sin conexión</h1>
  <p>No hay internet en este momento, pero tus datos están seguros en tu dispositivo.</p>
  <div class="badge">📊 Tus ventas y registros siguen disponibles</div>
  <div class="badge">💾 Todo guardado localmente</div>
  <button onclick="window.location.reload()">Intentar de nuevo</button>
  <script>
    // Redirige automáticamente cuando vuelve la conexión
    window.addEventListener('online', () => window.location.replace('/'));
  </script>
</body>
</html>
